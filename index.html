<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JmwSpinner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>JmwSpinner</h1>
    <p>Draw on the wheel, spin it under a strobe, and watch the marks drift.</p>
  </header>

  <main>
    <section class="views">
      <figure>
        <canvas id="wheel-view"></canvas>
        <figcaption>Wheel (as drawn)</figcaption>
      </figure>
      <figure>
        <canvas id="strobe-view"></canvas>
        <figcaption>Strobe (as seen spinning)</figcaption>
      </figure>
    </section>

    <section class="controls">
      <fieldset>
        <legend>Ring of marks</legend>
        <label for="count">Mark count</label>
        <input type="range" id="count" min="1" max="72" step="1" value="12">
        <input type="number" id="count-num" min="1" max="72" step="1">

        <label for="radius">Radius</label>
        <input type="range" id="radius" min="0.15" max="0.9" step="0.01" value="0.75">
        <input type="number" id="radius-num" min="0.15" max="0.9" step="0.01">
      </fieldset>

      <fieldset>
        <legend>Spin and strobe</legend>
        <label for="spin">Spin rate (rev/s)</label>
        <input type="range" id="spin" min="0" max="5" step="0.01" value="2.5">
        <input type="number" id="spin-num" min="0" max="5" step="0.01">

        <label for="strobe">Strobe rate (flashes/s)</label>
        <input type="range" id="strobe" min="1" max="120" step="0.1" value="30.5">
        <input type="number" id="strobe-num" min="1" max="120" step="0.1">

        <label for="afterglow">Afterglow (ms)</label>
        <input type="range" id="afterglow" min="0" max="500" step="5" value="0">
        <input type="number" id="afterglow-num" min="0" max="500" step="5">

        <button type="button" id="pause">Pause</button>
      </fieldset>

      <div id="readout" aria-live="polite"></div>
    </section>
  </main>

  <script src="src/maths.js"></script>
  <script src="src/render.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
