<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JmwSpinner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>JmwSpinner</h1>
    <p>Draw on the wheel, spin it under a strobe, and watch the marks drift.</p>
  </header>

  <main>
    <section class="views">
      <figure>
        <canvas id="wheel-view"></canvas>
        <figcaption>Wheel (as drawn)</figcaption>
      </figure>
      <figure>
        <canvas id="strobe-view"></canvas>
        <figcaption>Strobe (as seen spinning)</figcaption>
      </figure>
    </section>

    <section class="controls">
      <fieldset>
        <legend>Ring 1 (outer)</legend>
        <label for="count1">Mark count</label>
        <input type="range" id="count1" min="1" max="72" step="1" value="12">
        <input type="number" id="count1-num" min="1" max="72" step="1">

        <label for="radius1">Radius</label>
        <input type="range" id="radius1" min="0.15" max="0.9" step="0.01" value="0.8">
        <input type="number" id="radius1-num" min="0.15" max="0.9" step="0.01">
      </fieldset>

      <fieldset>
        <legend>Ring 2 (inner)</legend>
        <label for="count2">Mark count</label>
        <input type="range" id="count2" min="1" max="72" step="1" value="13">
        <input type="number" id="count2-num" min="1" max="72" step="1">

        <label for="radius2">Radius</label>
        <input type="range" id="radius2" min="0.15" max="0.9" step="0.01" value="0.5">
        <input type="number" id="radius2-num" min="0.15" max="0.9" step="0.01">
      </fieldset>

      <fieldset>
        <legend>Spin and strobe</legend>
        <label for="spin">Spin rate (rev/s)</label>
        <input type="range" id="spin" min="0" max="5" step="0.01" value="2.5">
        <input type="number" id="spin-num" min="0" step="any">

        <label for="strobe">Strobe rate (flashes/s)</label>
        <input type="range" id="strobe" min="1" max="120" step="0.1" value="31.2">
        <input type="number" id="strobe-num" min="1" step="any">

        <label for="afterglow">Afterglow (ms)</label>
        <input type="range" id="afterglow" min="0" max="500" step="5" value="0">
        <input type="number" id="afterglow-num" min="0" max="500" step="5">

        <button type="button" id="pause">Pause</button>
      </fieldset>

      <fieldset>
        <legend>Solve for opposite drift</legend>
        <label for="m1">Ring 1 spacings per flash</label>
        <span></span>
        <input type="number" id="m1" min="1" max="6" step="1" value="1">

        <label for="m2">Ring 2 spacings per flash</label>
        <span></span>
        <input type="number" id="m2" min="1" max="6" step="1" value="1">

        <div class="buttons">
          <button type="button" id="solve-strobe">Solve strobe rate</button>
          <button type="button" id="solve-spin">Solve spin rate</button>
        </div>
        <p id="solver-note" class="note">Sets the strobe rate (keeping spin) or the spin rate (keeping strobe) so the two rings drift at equal speed in opposite directions.</p>
      </fieldset>

      <div id="readout" aria-live="polite"></div>
    </section>
  </main>

  <script src="src/maths.js"></script>
  <script src="src/render.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
